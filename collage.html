<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collage | Lindeman Galleries</title>
  <link rel="stylesheet" href="assets/metal.css">
</head>
<body class="window">
  <header class="title-bar"><a href="index.html">Lindeman Galleries</a></header>
  <main class="collage-page">
    <h1>Collage</h1>
    <div class="collage">
      <fieldset class="work-list">
        <legend>Selected work</legend>
        <label><input type="radio" name="work" id="warm-field" aria-controls="preview-warm-field" checked> Warm Field</label>
        <label><input type="radio" name="work" id="low-tide" aria-controls="preview-low-tide"> Low Tide</label>
        <label><input type="radio" name="work" id="quiet-form" aria-controls="preview-quiet-form"> Quiet Form</label>
      </fieldset>
      <div class="work-preview" aria-live="polite">
        <!-- Replace each placeholder with an image using class="work-art",
             src pointing to a web-sized copy, and descriptive alt text. -->
        <figure id="preview-warm-field">
          <p class="work-art">Artwork placeholder</p>
          <figcaption><strong>Warm Field</strong><br>Sample title</figcaption>
        </figure>
        <figure id="preview-low-tide">
          <p class="work-art">Artwork placeholder</p>
          <figcaption><strong>Low Tide</strong><br>Sample title</figcaption>
        </figure>
        <figure id="preview-quiet-form">
          <p class="work-art">Artwork placeholder</p>
          <figcaption><strong>Quiet Form</strong><br>Sample title</figcaption>
        </figure>
      </div>
    </div>
  </main>
</body>
</html>
